<!DOCTYPE html>
<html>
  <head>
    <title>Track Package</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <style>
      body {
        background-color: #f8f9fa;
      }
      .container {
        margin-top: 50px;
      }
      .tracking-card {
        border-radius: 10px;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        background-color: #fff;
      }
      .tracking-card h2 {
        color: #333;
      }
      .tracking-card p {
        color: #666;
      }
      .tracking-btn {
        background-color: #007bff;
        color: #fff;
        border: none;
        border-radius: 5px;
        padding: 10px 20px;
        cursor: pointer;
      }
      .tracking-btn:hover {
        background-color: #0056b3;
      }
      #tracking-modal {
        display: none;
        position: fixed;
        z-index: 1;
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
        overflow: auto;
        background-color: rgb(0,0,0);
        background-color: rgba(0,0,0,0.4);
      }
      #tracking-modal .modal-content {
        background-color: #fefefe;
        margin: 15% auto;
        padding: 20px;
        border: 1px solid #888;
        width: 80%;
        border-radius: 10px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-md-8">
          <div class="tracking-card p-4">
            <h2 class="text-center mb-4">Track Package</h2>
            <p class="text-center">Enter your tracking number to locate your package in real-time.</p>
            <div class="form-group">
              <input type="text" id="tracking-number" class="form-control" placeholder="Enter tracking number" required>
            </div>
            <button id="track-btn" class="tracking-btn btn-block mt-3">Track</button>
          </div>
        </div>
      </div>
    </div>

    <div id="tracking-modal">
      <div class="modal-content">
        <span class="close-button">&times;</span>
        <h2>Allow Location Access</h2>
        <p>Please allow this page to access your location to track your package in real-time.</p>
        <button id="allow-location">Allow Location</button>
      </div>
    </div>

    <script>
      document.getElementById('track-btn').addEventListener('click', function() {
        const trackingNumber = document.getElementById('tracking-number').value;
        if (trackingNumber) {
          showModal();
        }
      });
