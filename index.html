<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Pembuatan Kartu Identitas</title>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <!-- html2canvas -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 2rem 1.5rem;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow-x: hidden;
        }

        /* Background animasi */
        body::before {
            content: '';
            position: fixed;
            width: 300px;
            height: 300px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 50%;
            top: -100px;
            right: -100px;
            animation: floatBubble 20s infinite ease-in-out;
        }

        body::after {
            content: '';
            position: fixed;
            width: 400px;
            height: 400px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 50%;
            bottom: -150px;
            left: -150px;
            animation: floatBubble 25s infinite ease-in-out reverse;
        }

        @keyframes floatBubble {
            0%, 100% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(50px, -50px) scale(1.2); }
        }

        .container {
            max-width: 1200px;
            width: 100%;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
            position: relative;
            z-index: 1;
        }

        /* Form Section - Card Style */
        .form-section {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            border-radius: 30px;
            padding: 2.5rem 2rem;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.3), 0 0 0 1px rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: transform 0.3s ease;
        }

        .form-section:hover {
            transform: translateY(-5px);
        }

        .form-header {
            text-align: center;
            margin-bottom: 2rem;
            padding-bottom: 1.5rem;
            border-bottom: 3px solid;
            border-image: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-image-slice: 1;
        }

        .form-header .icon-wrapper {
            display: inline-block;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 1rem;
            border-radius: 20px;
            margin-bottom: 0.8rem;
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
        }

        .form-header .icon-wrapper i {
            font-size: 2.5rem;
            color: white;
        }

        .form-header h1 {
            font-size: 1.8rem;
            font-weight: 800;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            letter-spacing: -0.5px;
        }

        .form-header .subtitle {
            color: #6b7280;
            font-size: 0.9rem;
            margin-top: 0.3rem;
        }

        .form-header .subtitle i {
            color: #667eea;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.2rem;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
        }

        .form-group.full-width {
            grid-column: 1 / -1;
        }

        .form-group label {
            font-weight: 600;
            font-size: 0.85rem;
            color: #374151;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .form-group label i {
            color: #667eea;
            width: 18px;
            font-size: 0.9rem;
        }

        .form-group label .required {
            color: #ef4444;
            margin-left: 2px;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            padding: 0.7rem 1rem;
            border: 2px solid #e5e7eb;
            border-radius: 14px;
            font-size: 0.9rem;
            transition: all 0.3s;
            background: white;
            color: #1f2937;
            font-family: inherit;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.15);
            transform: scale(1.01);
        }

        .form-group textarea {
            resize: vertical;
            min-height: 50px;
        }

        /* Photo Upload */
        .photo-upload-wrapper {
            display: flex;
            align-items: center;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .photo-upload-wrapper .upload-area {
            flex: 1;
            padding: 0.5rem;
            border: 2px dashed #667eea;
            border-radius: 14px;
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.05), rgba(118, 75, 162, 0.05));
            cursor: pointer;
            transition: all 0.3s;
            position: relative;
        }

        .photo-upload-wrapper .upload-area:hover {
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.1), rgba(118, 75, 162, 0.1));
            border-color: #764ba2;
        }

        .photo-upload-wrapper input[type="file"] {
            width: 100%;
            padding: 0.5rem;
            border: none;
            background: transparent;
            cursor: pointer;
            font-size: 0.85rem;
        }

        .photo-upload-wrapper input[type="file"]::-webkit-file-upload-button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 0.4rem 1.2rem;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
        }

        .photo-upload-wrapper input[type="file"]::-webkit-file-upload-button:hover {
            transform: scale(1.05);
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }

        .photo-preview {
            width: 65px;
            height: 65px;
            border-radius: 50%;
            border: 3px solid #667eea;
            object-fit: cover;
            display: none;
            background: #f3f4f6;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
        }

        .photo-preview.show {
            display: block;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.8); }
            to { opacity: 1; transform: scale(1); }
        }

        /* Radio Group */
        .radio-group {
            display: flex;
            gap: 1.5rem;
            padding-top: 0.2rem;
            flex-wrap: wrap;
        }

        .radio-group label {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 500;
            font-size: 0.9rem;
            cursor: pointer;
            padding: 0.3rem 0.8rem;
            border-radius: 10px;
            transition: all 0.3s;
        }

        .radio-group label:hover {
            background: rgba(102, 126, 234, 0.1);
        }

        .radio-group input[type="radio"] {
            accent-color: #667eea;
            width: 18px;
            height: 18px;
            margin: 0;
            cursor: pointer;
        }

        /* Button */
        .btn-submit {
            grid-column: 1 / -1;
            padding: 0.9rem;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 60px;
            font-size: 1.05rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 0.5rem;
            box-shadow: 0 8px 30px rgba(102, 126, 234, 0.4);
            position: relative;
            overflow: hidden;
        }

        .btn-submit::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.5s;
        }

        .btn-submit:hover::before {
            left: 100%;
        }

        .btn-submit:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 40px rgba(102, 126, 234, 0.5);
        }

        .btn-submit:active {
            transform: scale(0.97);
        }

        .btn-submit i {
            font-size: 1.2rem;
        }

        /* Status */
        #statusMessage {
            grid-column: 1 / -1;
            padding: 0.8rem 1.2rem;
            border-radius: 16px;
            font-weight: 600;
            display: none;
            align-items: center;
            gap: 12px;
            font-size: 0.9rem;
            animation: slideDown 0.3s ease;
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        #statusMessage.success {
            display: flex;
            background: linear-gradient(135deg, #d1fae5, #a7f3d0);
            color: #065f46;
            border: 1px solid #6ee7b7;
        }

        #statusMessage.error {
            display: flex;
            background: linear-gradient(135deg, #fee2e2, #fecaca);
            color: #991b1b;
            border: 1px solid #fca5a5;
        }

        #statusMessage.loading {
            display: flex;
            background: linear-gradient(135deg, #e0e7ff, #c7d2fe);
            color: #1e3a8a;
            border: 1px solid #93b4f8;
        }

        /* ============ KARTU IDENTITAS ============ */
        .card-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            gap: 1.2rem;
        }

        .card-wrapper {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            border-radius: 30px;
            padding: 2rem 1.8rem;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.3), 0 0 0 1px rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: transform 0.3s ease;
        }

        .card-wrapper:hover {
            transform: translateY(-5px);
        }

        .card-wrapper .card-title-section {
            text-align: center;
            margin-bottom: 1.2rem;
        }

        .card-wrapper .card-title-section h2 {
            font-size: 1.3rem;
            font-weight: 800;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .card-wrapper .card-title-section p {
            font-size: 0.8rem;
            color: #6b7280;
        }

        /* Desain Kartu */
        #identityCard {
            width: 100%;
            max-width: 400px;
            aspect-ratio: 3/2;
            background: linear-gradient(145deg, #ffffff, #f8faff);
            border-radius: 24px;
            padding: 1.5rem 1.5rem 1.2rem;
            box-shadow: 0 20px 50px -12px rgba(0, 0, 0, 0.25);
            border: 2px solid rgba(102, 126, 234, 0.3);
            position: relative;
            overflow: hidden;
            transition: all 0.3s;
        }

        #identityCard::before {
            content: '';
            position: absolute;
            top: -60%;
            right: -30%;
            width: 250px;
            height: 250px;
            background: radial-gradient(circle, rgba(102, 126, 234, 0.08) 0%, transparent 70%);
            border-radius: 50%;
        }

        #identityCard::after {
            content: '✦';
            position: absolute;
            bottom: 15px;
            right: 20px;
            font-size: 2.8rem;
            opacity: 0.06;
            color: #667eea;
            font-weight: 300;
        }

        /* Strip gradien atas */
        .card-strip {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 5px;
            background: linear-gradient(90deg, #667eea, #764ba2, #f093fb, #667eea);
            background-size: 300% 100%;
            animation: gradientMove 3s ease infinite;
        }

        @keyframes gradientMove {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid rgba(102, 126, 234, 0.2);
            padding-bottom: 0.6rem;
            margin-bottom: 0.8rem;
            position: relative;
            z-index: 1;
        }

        .card-header .card-title {
            font-weight: 800;
            font-size: 0.9rem;
            color: #1f2937;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .card-header .card-title i {
            color: #667eea;
            font-size: 1rem;
        }

        .card-header .card-badge {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 0.2rem 0.8rem;
            border-radius: 30px;
            font-size: 0.55rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3);
        }

        .card-body {
            display: grid;
            grid-template-columns: 70px 1fr 1.2fr;
            gap: 0.3rem 0.6rem;
            font-size: 0.7rem;
            position: relative;
            z-index: 1;
            align-items: start;
        }

        /* Foto di kartu */
        .card-photo {
            grid-row: 1 / 6;
            width: 62px;
            height: 62px;
            border-radius: 14px;
            border: 3px solid;
            border-image: linear-gradient(135deg, #667eea, #764ba2);
            border-image-slice: 1;
            object-fit: cover;
            background: linear-gradient(135deg, #f3f4f6, #e5e7eb);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            color: #9ca3af;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.2);
        }

        .card-photo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .card-photo .placeholder-icon {
            font-size: 2rem;
            color: #9ca3af;
        }

        .card-body .label {
            font-weight: 600;
            color: #6b7280;
            font-size: 0.55rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .card-body .label i {
            color: #667eea;
            font-size: 0.6rem;
        }

        .card-body .value {
            font-weight: 600;
            color: #1f2937;
            word-break: break-word;
            font-size: 0.75rem;
            grid-column: span 2;
        }

        .card-body .value.empty {
            color: #9ca3af;
            font-style: italic;
            font-weight: 400;
        }

        .card-body .full-width {
            grid-column: 2 / -1;
        }

        .card-footer {
            margin-top: 0.6rem;
            padding-top: 0.5rem;
            border-top: 1px dashed rgba(102, 126, 234, 0.2);
            display: flex;
            justify-content: space-between;
            font-size: 0.55rem;
            color: #9ca3af;
            position: relative;
            z-index: 1;
        }

        .card-footer .footer-icon {
            color: #667eea;
        }

        /* Tombol Download */
        .btn-download {
            padding: 0.7rem 2rem;
            background: linear-gradient(135deg, #10b981, #059669);
            color: white;
            border: none;
            border-radius: 60px;
            font-size: 0.95rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 8px 30px rgba(16, 185, 129, 0.4);
            margin-top: 0.5rem;
            width: 100%;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        .btn-download::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.5s;
        }

        .btn-download:hover::before {
            left: 100%;
        }

        .btn-download:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 40px rgba(16, 185, 129, 0.5);
        }

        .btn-download:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .btn-download i {
            font-size: 1.1rem;
        }

        .card-info-text {
            font-size: 0.7rem;
            color: #6b7280;
            margin-top: 0.3rem;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .card-info-text i {
            color: #667eea;
        }

        /* Responsive */
        @media (max-width: 1024px) {
            .container {
                gap: 1.5rem;
            }
        }

        @media (max-width: 900px) {
            .container {
                grid-template-columns: 1fr;
                gap: 1.5rem;
                max-width: 600px;
            }
            .card-section {
                order: 2;
            }
            .form-section {
                order: 1;
            }
        }

        @media (max-width: 600px) {
            body {
                padding: 1rem;
            }
            .form-section {
                padding: 1.5rem 1.2rem;
                border-radius: 20px;
            }
            .form-grid {
                grid-template-columns: 1fr;
                gap: 0.8rem;
            }
            .form-group.full-width {
                grid-column: 1;
            }
            .btn-submit {
                grid-column: 1;
            }
            #statusMessage {
                grid-column: 1;
            }
            .form-header h1 {
                font-size: 1.4rem;
            }
            .form-header .icon-wrapper {
                padding: 0.8rem;
            }
            .form-header .icon-wrapper i {
                font-size: 2rem;
            }
            #identityCard {
                max-width: 100%;
                padding: 1rem;
            }
            .card-body {
                grid-template-columns: 55px 1fr 1fr;
                gap: 0.2rem 0.4rem;
                font-size: 0.65rem;
            }
            .card-photo {
                width: 50px;
                height: 50px;
            }
            .card-body .value {
                font-size: 0.65rem;
            }
            .photo-upload-wrapper {
                flex-direction: column;
                align-items: stretch;
            }
            .photo-preview {
                align-self: center;
            }
            .card-wrapper {
                padding: 1.2rem 1rem;
                border-radius: 20px;
            }
        }

        @media (max-width: 400px) {
            .radio-group {
                gap: 0.8rem;
            }
            .radio-group label {
                font-size: 0.8rem;
                padding: 0.2rem 0.5rem;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <!-- FORM SECTION -->
    <div class="form-section">
        <div class="form-header">
            <div class="icon-wrapper">
                <i class="fas fa-id-card"></i>
            </div>
            <h1>Pembuatan Kartu Identitas</h1>
            <div class="subtitle">
                <i class="fas fa-telegram"></i> Data akan dikirim ke Telegram &amp; Kartu dibuat otomatis
            </div>
        </div>

        <form id="studentForm" class="form-grid">
            <!-- Nama -->
            <div class="form-group full-width">
                <label><i class="fas fa-user"></i> Nama Lengkap <span class="required">*</span></label>
                <input type="text" id="nama" placeholder="Masukkan nama lengkap" required />
            </div>

            <!-- Jenis Kelamin -->
            <div class="form-group">
                <label><i class="fas fa-venus-mars"></i> Jenis Kelamin <span class="required">*</span></label>
                <div class="radio-group">
                    <label><input type="radio" name="jenis_kelamin" value="Laki-laki" required /> Laki-laki</label>
                    <label><input type="radio" name="jenis_kelamin" value="Perempuan" /> Perempuan</label>
                </div>
            </div>

            <!-- Umur -->
            <div class="form-group">
                <label><i class="fas fa-calendar-alt"></i> Umur (tahun) <span class="required">*</span></label>
                <input type="number" id="umur" placeholder="17" min="1" max="99" required />
            </div>

            <!-- Foto Upload -->
            <div class="form-group full-width">
                <label><i class="fas fa-camera"></i> Foto <span class="required">*</span></label>
                <div class="photo-upload-wrapper">
                    <div class="upload-area">
                        <input type="file" id="foto" accept="image/*" required />
                    </div>
                    <img id="photoPreview" class="photo-preview" alt="Preview foto" />
                </div>
            </div>

            <!-- Sekolah -->
            <div class="form-group full-width">
                <label><i class="fas fa-school"></i> Asal Sekolah / Institusi <span class="required">*</span></label>
                <input type="text" id="sekolah" placeholder="Nama sekolah" required />
            </div>

            <!-- Alamat -->
            <div class="form-group">
                <label><i class="fas fa-map-pin"></i> Desa / Kelurahan <span class="required">*</span></label>
                <input type="text" id="desa" placeholder="Desa" required />
            </div>
            <div class="form-group">
                <label><i class="fas fa-map-pin"></i> Kecamatan <span class="required">*</span></label>
                <input type="text" id="kecamatan" placeholder="Kecamatan" required />
            </div>
            <div class="form-group">
                <label><i class="fas fa-map-pin"></i> Kabupaten / Kota <span class="required">*</span></label>
                <input type="text" id="kabupaten" placeholder="Kabupaten" required />
            </div>
            <div class="form-group">
                <label><i class="fas fa-map-pin"></i> Provinsi <span class="required">*</span></label>
                <input type="text" id="provinsi" placeholder="Provinsi" required />
            </div>

            <div class="form-group full-width">
                <label><i class="fas fa-home"></i> Detail Alamat (opsional)</label>
                <textarea id="detail_alamat" placeholder="RT/RW, nama jalan, atau keterangan tambahan"></textarea>
            </div>

            <button type="submit" class="btn-submit" id="submitBtn">
                <i class="fab fa-telegram-plane"></i> Kirim &amp; Buat Kartu
            </button>

            <div id="statusMessage"></div>
        </form>
    </div>

    <!-- KARTU IDENTITAS SECTION -->
    <div class="card-section">
        <div class="card-wrapper">
            <div class="card-title-section">
                <h2><i class="fas fa-id-card"></i> Kartu Identitas</h2>
                <p><i class="fas fa-arrow-down" style="color:#667eea;"></i> Hasil akan muncul di sini</p>
            </div>

            <!-- Kartu Identitas -->
            <div id="identityCard">
                <div class="card-strip"></div>
                <div class="card-header">
                    <span class="card-title"><i class="fas fa-graduation-cap"></i> KARTU IDENTITAS</span>
                    <span class="card-badge">#2026</span>
                </div>
                <div class="card-body" id="cardBody">
                    <!-- Foto -->
                    <div class="card-photo" id="cardPhoto">
                        <span class="placeholder-icon"><i class="fas fa-user-circle"></i></span>
                    </div>

                    <span class="label" style="grid-column:2;"><i class="fas fa-user"></i> Nama</span>
                    <span class="value empty" id="cardNama" style="grid-column:3;">-</span>

                    <span class="label" style="grid-column:2;"><i class="fas fa-venus-mars"></i> JK</span>
                    <span class="value empty" id="cardJK" style="grid-column:3;">-</span>

                    <span class="label" style="grid-column:2;"><i class="fas fa-calendar-alt"></i> Umur</span>
                    <span class="value empty" id="cardUmur" style="grid-column:3;">-</span>

                    <span class="label" style="grid-column:2;"><i class="fas fa-school"></i> Sekolah</span>
                    <span class="value empty" id="cardSekolah" style="grid-column:3;">-</span>

                    <span class="label" style="grid-column:2; margin-top:2px;"><i class="fas fa-map-pin"></i> Alamat</span>
                    <span class="value empty" id="cardAlamat" style="grid-column:3; font-size:0.65rem;">-</span>
                </div>
                <div class="card-footer">
                    <span><i class="fas fa-calendar-check footer-icon"></i> <span id="cardDate">-</span></span>
                    <span><i class="fas fa-check-circle" style="color:#10b981;"></i> Tervalidasi</span>
                </div>
            </div>

            <!-- Tombol Download -->
            <button class="btn-download" id="downloadBtn" disabled>
                <i class="fas fa-download"></i> Download Kartu (PNG)
            </button>
            <div class="card-info-text">
                <i class="fas fa-info-circle"></i> Isi semua data &amp; upload foto, lalu klik "Kirim &amp; Buat Kartu"
            </div>
        </div>
    </div>
</div>

<script>
    // =====================================================
    // KONFIGURASI TELEGRAM BOT
    // =====================================================
    const BOT_TOKEN = 'YOUR_BOT_TOKEN';   // Ganti dengan token bot Anda
    const CHAT_ID   = 'YOUR_CHAT_ID';     // Ganti dengan chat ID tujuan

    // =====================================================
    // ELEMEN
    // =====================================================
    const form = document.getElementById('studentForm');
    const statusDiv = document.getElementById('statusMessage');
    const submitBtn = document.getElementById('submitBtn');
    const downloadBtn = document.getElementById('downloadBtn');

    // Elemen kartu
    const cardNama = document.getElementById('cardNama');
    const cardJK = document.getElementById('cardJK');
    const cardUmur = document.getElementById('cardUmur');
    const cardSekolah = document.getElementById('cardSekolah');
    const cardAlamat = document.getElementById('cardAlamat');
    const cardDate = document.getElementById('cardDate');
    const cardPhoto = document.getElementById('cardPhoto');

    // Elemen upload foto
    const fotoInput = document.getElementById('foto');
    const photoPreview = document.getElementById('photoPreview');

    let currentData = null;
    let uploadedPhotoDataURL = null;

    // =====================================================
    // PREVIEW FOTO
    // =====================================================
    fotoInput.addEventListener('change', function(e) {
        const file = this.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = function(event) {
                photoPreview.src = event.target.result;
                photoPreview.classList.add('show');
                uploadedPhotoDataURL = event.target.result;
            };
            reader.readAsDataURL(file);
        } else {
            photoPreview.classList.remove('show');
            uploadedPhotoDataURL = null;
        }
    });

    // =====================================================
    // FUNGSI TELEGRAM
    // =====================================================
    async function sendToTelegram(data) {
        const message = `
📋 *DATA IDENTITAS BARU*

👤 *Nama:* ${data.nama}
⚥ *Jenis Kelamin:* ${data.jenis_kelamin}
📅 *Umur:* ${data.umur} tahun
📸 *Foto:* ${data.foto ? '✅ Ada' : '❌ Tidak ada'}

🏫 *Sekolah:* ${data.sekolah}

📍 *Alamat Lengkap:*
   Desa/Kelurahan : ${data.desa}
   Kecamatan      : ${data.kecamatan}
   Kabupaten/Kota : ${data.kabupaten}
   Provinsi       : ${data.provinsi}
   Detail         : ${data.detail_alamat || '-'}

📆 *Dikirim:* ${new Date().toLocaleString('id-ID')}
        `;

        const url = `https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`;
        const payload = {
            chat_id: CHAT_ID,
            text: message,
            parse_mode: 'Markdown'
        };

        const response = await fetch(url, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        });

        if (!response.ok) {
            const errorText = await response.text();
            throw new Error(`Telegram API error: ${response.status} - ${errorText}`);
        }
        return await response.json();
    }

    // =====================================================
    // FUNGSI UPDATE KARTU
    // =====================================================
    function updateCard(data, fotoDataURL) {
        // Update nilai di kartu
        cardNama.textContent = data.nama;
        cardNama.className = 'value';

        cardJK.textContent = data.jenis_kelamin;
        cardJK.className = 'value';

        cardUmur.textContent = data.umur + ' tahun';
        cardUmur.className = 'value';

        cardSekolah.textContent = data.sekolah;
        cardSekolah.className = 'value';

        // Gabungkan alamat
        let alamat = `${data.desa}, ${data.kecamatan}, ${data.kabupaten}, ${data.provinsi}`;
        if (data.detail_alamat) {
            alamat += ` (${data.detail_alamat})`;
        }
        cardAlamat.textContent = alamat;
        cardAlamat.className = 'value';

        // Update foto di kartu
        if (fotoDataURL) {
            cardPhoto.innerHTML = `<img src="${fotoDataURL}" alt="Foto" />`;
        } else {
            cardPhoto.innerHTML = `<span class="placeholder-icon"><i class="fas fa-user-circle"></i></span>`;
        }

        // Update tanggal
        const now = new Date();
        cardDate.textContent = now.toLocaleDateString('id-ID', {
            day: 'numeric', month: 'long', year: 'numeric'
        });

        // Aktifkan tombol download
        downloadBtn.disabled = false;
        currentData = data;
    }

    // =====================================================
    // FUNGSI DOWNLOAD KARTU
    // =====================================================
    async function downloadCard() {
        const card = document.getElementById('identityCard');

        downloadBtn.disabled = true;
        downloadBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Menyiapkan...';

        try {
            const canvas = await html2canvas(card, {
                scale: 2.5,
                backgroundColor: '#ffffff',
                allowTaint: true,
                useCORS: true,
                logging: false
            });

            const link = document.createElement('a');
            link.download = `Kartu_Identitas_${currentData ? currentData.nama.replace(/\s+/g, '_') : 'Siswa'}.png`;
            link.href = canvas.toDataURL('image/png');
            link.click();

        } catch (error) {
            console.error('Error download:', error);
            alert('Gagal mendownload kartu. Silakan coba lagi.');
        } finally {
            downloadBtn.disabled = false;
            downloadBtn.innerHTML = '<i class="fas fa-download"></i> Download Kartu (PNG)';
        }
    }

    // =====================================================
    // HANDLER FORM
    // =====================================================
    function getSelectedGender() {
        const radios = document.querySelectorAll('input[name="jenis_kelamin"]');
        for (let radio of radios) {
            if (radio.checked) return radio.value;
        }
        return null;
    }

    function setStatus(type, message) {
        statusDiv.className = type;
        statusDiv.innerHTML = message;
        statusDiv.style.display = 'flex';
    }

    function clearStatus() {
        statusDiv.className = '';
        statusDiv.style.display = 'none';
        statusDiv.innerHTML = '';
    }

    form.addEventListener('submit', async (e) => {
        e.preventDefault();

        // Ambil data
        const nama = document.getElementById('nama').value.trim();
        const umur = document.getElementById('umur').value.trim();
        const sekolah = document.getElementById('sekolah').value.trim();
        const desa = document.getElementById('desa').value.trim();
        const kecamatan = document.getElementById('kecamatan').value.trim();
        const kabupaten = document.getElementById('kabupaten').value.trim();
        const provinsi = document.getElementById('provinsi').value.trim();
        const detailAlamat = document.getElementById('detail_alamat').value.trim();
        const jenisKelamin = getSelectedGender();
        const fotoFile = document.getElementById('foto').files[0];

        // Validasi
        if (!nama || !umur || !sekolah || !desa || !kecamatan || !kabupaten || !provinsi) {
            setStatus('error', '⚠️ Semua field bertanda * wajib diisi!');
            return;
        }

        if (!jenisKelamin) {
            setStatus('error', '⚠️ Silakan pilih jenis kelamin!');
            return;
        }

        if (isNaN(umur) || parseInt(umur) < 1 || parseInt(umur) > 99) {
            setStatus('error', '⚠️ Umur harus angka antara 1-99!');
            return;
        }

        if (!fotoFile) {
            setStatus('error', '⚠️ Silakan upload foto!');
            return;
        }

        const data = {
            nama,
            jenis_kelamin: jenisKelamin,
            umur: parseInt(umur),
            sekolah,
            desa,
            kecamatan,
            kabupaten,
            provinsi,
            detail_alamat: detailAlamat,
            foto: fotoFile.name
        };

        // Nonaktifkan tombol
        submitBtn.disabled = true;
        submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Memproses...';
        setStatus('loading', '⏳ Mengirim ke Telegram & membuat kartu...');

        try {
            // Kirim ke Telegram
            if (BOT_TOKEN !== '7845051357:AAE2XSIzrwuD1QQ2h5x1kl4F82RUh4dbbXo' && CHAT_ID !== '1966317946') {
                await sendToTelegram(data);
            } else {
                console.warn('⚠️ Telegram bot token/chat ID default, lewati kirim ke Telegram');
                setStatus('loading', '⏳ Token bot default, hanya membuat kartu...');
            }

            // Update kartu dengan foto
            updateCard(data, uploadedPhotoDataURL);

            setStatus('success', '✅ Data terkirim & Kartu Identitas siap! 🎉');

            // Reset form (kecuali foto preview tetap)
            const formElements = form.querySelectorAll('input:not([type="file"]), textarea');
            formElements.forEach(el => {
                if (el.type !== 'radio') {
                    el.value = '';
                }
            });
            document.querySelectorAll('input[type="radio"]').forEach(r => r.checked = false);
            fotoInput.value = '';

            setTimeout(clearStatus, 5000);

        } catch (error) {
            console.error('Error:', error);
            setStatus('error', `❌ Gagal: ${error.message}`);
        } finally {
            submitBtn.disabled = false;
            submitBtn.innerHTML = '<i class="fab fa-telegram-plane"></i> Kirim &amp; Buat Kartu';
        }
    });

    // =====================================================
    // EVENT DOWNLOAD
    // =====================================================
    downloadBtn.addEventListener('click', downloadCard);

    // =====================================================
    // CEK KONFIGURASI BOT
    // =====================================================
    if (BOT_TOKEN === 'YOUR_BOT_TOKEN' || CHAT_ID === 'YOUR_CHAT_ID') {
        const warning = document.createElement('div');
        warning.style.cssText = `
            grid-column: 1 / -1;
            background: linear-gradient(135deg, #fef3c7, #fde68a);
            color: #78350f;
            padding: 0.6rem 1rem;
            border-radius: 14px;
            border: 1px solid #f59e0b;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.8rem;
        `;
        warning.innerHTML = `<i class="fas fa-triangle-exclamation"></i> 
            <span>⚠️ Bot Token/ID masih default. <strong>Edit di JavaScript</strong> agar kirim ke Telegram.</span>`;
        form.prepend(warning);
    }

    // Set default date di kartu
    const now = new Date();
    cardDate.textContent = now.toLocaleDateString('id-ID', {
        day: 'numeric', month: 'long', year: 'numeric'
    });
</script>

</body>
</html>
